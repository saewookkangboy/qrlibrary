function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function state(){return saved[active]||{values:{},checked:[],complete:false}}function store(next){saved[active]=Object.assign({values:{},checked:[],complete:false},saved[active]||{},next);localStorage.setItem(key,JSON.stringify(saved));render();}
function nav(q){q=(q||'').toLowerCase();var out='';db.sections.forEach(function(s){var items=s.resources.filter(function(r){return !q||(r.title+' '+r.part+' '+r.chapter).toLowerCase().indexOf(q)>-1});if(!items.length)return;out+='<div class="group-title"><b>'+s.id+'</b>'+esc(s.label)+'</div>';items.forEach(function(r){out+='<button data-id="'+r.id+'" class="'+(r.id===active?'active':'')+'"><span class="dot">'+(saved[r.id]&&saved[r.id].complete?'✓':'')+'</span><span>'+esc(r.title)+'</span></button>'})});document.getElementById('nav').innerHTML=out||'<div class="empty">검색 결과가 없습니다.</div>';document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){active=this.dataset.id;render();document.getElementById('sidebar').classList.remove('open')}});var done=Object.keys(saved).filter(function(k){return saved[k].complete}).length,p=Math.round(done/db.total*100);document.getElementById('progress').innerHTML='<div><span>내 실습 진도</span><strong>'+done+'/'+db.total+'</strong></div><div class="bar"><i style="width:'+p+'%"></i></div><small>작성 내용은 이 기기에 자동 저장됩니다.</small>'}
function title(n,t,s){return '<div class="title"><span>'+n+'</span><div><h2>'+t+'</h2><p>'+s+'</p></div></div>'}function current(){return all.filter(function(r){return r.id===active})[0]||all[0]}
function render(){var r=current(),st=state();document.getElementById('crumb').textContent='온라인 부록 / '+r.part+' / '+r.title;var fields=r.fields.map(function(f){return '<label><span>'+esc(f.label)+'</span><textarea data-field="'+esc(f.label)+'" placeholder="'+esc(f.placeholder)+'">'+esc(st.values[f.label]||'')+'</textarea></label>'}).join('');var checks=r.checks.map(function(x,i){return '<label class="'+(st.checked[i]?'on':'')+'"><input type="checkbox" data-check="'+i+'" '+(st.checked[i]?'checked':'')+'><span class="box">'+(st.checked[i]?'✓':'')+'</span><span>'+esc(x)+'</span></label>'}).join('');var ok=r.checks.every(function(_,i){return st.checked[i]});
document.getElementById('content').innerHTML='<section class="hero"><div><div class="eyebrow"><b>'+esc(r.part)+'</b>'+esc(r.chapter)+'</div><h1>'+esc(r.title)+'</h1><p>'+esc(r.outcome)+'</p></div><div class="meta"><div><span>예상 시간</span><strong>'+esc(r.time)+'</strong></div><div><span>제공 형식</span><strong>'+esc(r.format)+'</strong></div><div><span>저장 방식</span><strong>자동 저장</strong></div></div></section><div class="grid"><div class="main"><section class="panel">'+title('01','이렇게 완성합니다','책의 개념을 실제 업무 산출물로 바꾸는 순서입니다.')+'<ol class="steps">'+r.steps.map(function(x,i){return '<li><b>0'+(i+1)+'</b><span>'+esc(x)+'</span></li>'}).join('')+'</ol></section><section class="panel">'+title('02','내 업무로 작성하기','확인 가능한 사실과 기준부터 적으세요.')+'<div class="fields">'+fields+'</div></section><section class="panel">'+title('03','Agent에게 실행 요청하기','작성한 내용을 아래 지시문과 함께 붙여 넣으세요.')+'<div class="prompt"><pre>'+esc(r.prompt)+'</pre><button id="copy">프롬프트 복사</button></div><div class="note">고객·직원·계정 정보는 제거하거나 익명화한 뒤 입력하세요.</div></section></div><aside class="side"><section class="panel">'+title('04','최종 검수','세 항목을 모두 확인하면 완료할 수 있습니다.')+'<div class="checks">'+checks+'</div><button class="action" id="download">작성본 내려받기</button><button class="action primary '+(st.complete?'done':'')+'" id="complete" '+(ok?'':'disabled')+'>'+(st.complete?'완료됨 · 다시 열기':'이 실습 완료하기')+'</button><p class="help">완료 전에도 Markdown 파일로 내려받을 수 있습니다.</p></section><section class="book"><b>▤</b><div><span>책에서 다시 보기</span><strong>'+esc(r.part)+'</strong><p>'+esc(r.chapter)+'</p></div></section></aside></div>';
document.querySelectorAll('textarea[data-field]').forEach(function(t){t.oninput=function(){var n=Object.assign({},state().values);n[this.dataset.field]=this.value;saved[active]=Object.assign({},state(),{values:n});localStorage.setItem(key,JSON.stringify(saved))}});document.querySelectorAll('input[data-check]').forEach(function(c){c.onchange=function(){var n=state().checked.slice();n[+this.dataset.check]=this.checked;store({checked:n})}});document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(r.prompt);this.textContent='복사됨';var b=this;setTimeout(function(){b.textContent='프롬프트 복사'},1400)};document.getElementById('download').onclick=function(){download(r,state())};document.getElementById('complete').onclick=function(){store({complete:!state().complete})};nav(document.getElementById('search').value)}
function download(r,st){var text='# '+r.title+'\n\n- 연결: '+r.part+' · '+r.chapter+'\n- 완성 결과: '+r.outcome+'\n\n'+r.fields.map(function(f){return '## '+f.label+'\n'+(st.values[f.label]||'[작성 필요]')}).join('\n\n')+'\n\n## 실행 프롬프트\n\n'+r.prompt+'\n\n## 최종 검수\n'+r.checks.map(function(x,i){return '- ['+(st.checked[i]?'x':' ')+'] '+x}).join('\n');var u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=r.title.replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'_')+'.md';a.click();URL.revokeObjectURL(u)}
document.getElementById('search').oninput=function(){nav(this.value)};document.getElementById('mobile').onclick=function(){document.getElementById('sidebar').classList.toggle('open')};render();
})();
</script></body></html>
